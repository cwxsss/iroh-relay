name: Publish UniClipboard relay image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker Hub image tag
        required: true
        type: string
        default: 1.0.0-rc.1

env:
  IMAGE_NAME: chuais/iroh-relay

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'chuais' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.TOK }}

      - name: Build and push relay image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ inputs.tag }}"
